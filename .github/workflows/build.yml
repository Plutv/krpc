name: Build and Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test RPC modules
        run: mvn --batch-mode --no-transfer-progress clean install
      - name: Test and package JMeter sampler
        run: mvn --batch-mode --no-transfer-progress -f tools/jmeter/pom.xml clean package
